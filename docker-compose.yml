services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 2s
      retries: 30
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      RATE_LIMIT: ${RATE_LIMIT:-30/minute}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      ANTHROPIC_API_KEY: # passed through from the host shell, never stored in a file
    ports: ["8000:8000"]
volumes:
  pgdata:
