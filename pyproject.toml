[project]
name = "cited-answer-engine"
version = "0.1.0"
description = "RAG service that answers with citations and refuses when the corpus lacks the answer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.70",
    "sentence-transformers>=3.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Postgres and local models"]
